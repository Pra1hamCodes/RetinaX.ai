worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 15M;          # cover the 10 MB upload limit + multipart overhead

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:5173; }

    server {
        listen 80;
        server_name _;

        # ---------- API ----------
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ---------- Static storage (uploads + heatmaps) ----------
        location /storage/ {
            alias /var/www/storage/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ---------- Frontend ----------
        # In dev, proxy to Vite (HMR via WS).
        # In prod, the prod overlay swaps this for `root /var/www/frontend`.
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
